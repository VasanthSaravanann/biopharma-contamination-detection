name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12]
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install system deps
      run: |
        python -m pip install --upgrade pip
    - name: Install pip requirements
      run: |
        pip install -r requirements.txt
        # Install pinned CPU PyTorch wheel
        pip install --index-url https://download.pytorch.org/whl/cpu torch==2.2.0 torchvision==0.15.2
    - name: Run tests
      env:
        PYTHONPATH: .
      run: |
        pytest -q

  test-gpu-optional:
    runs-on: ubuntu-latest
    if: false # optional: enable when GPU runners are available
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.11
    - name: Install GPU PyTorch (optional)
      run: |
        pip install -r requirements.txt
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cu118
    - name: Run heavy NN tests
      env:
        PYTHONPATH: .
      run: |
        pytest -q -k "not quick"
